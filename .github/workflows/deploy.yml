name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Find frontend
        run: |
          echo "Repository contents:"
          ls -la
          FRONTEND_DIR="$(dirname "$(find . -maxdepth 4 -type f -name package.json -print -quit)")"
          if [ "$FRONTEND_DIR" = "." ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "Frontend directory: $FRONTEND_DIR"
          echo "FRONTEND_DIR=$FRONTEND_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$FRONTEND_DIR"
          npm install

      - name: Build React app
        run: |
          cd "$FRONTEND_DIR"
          npm run build -- --base=/anubhav-portfolio/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.FRONTEND_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# GitHub Pages deployment workflow
